# Publishes a data release (F-01): builds the catalog like data-snapshot.yml and
# attaches it to a GitHub release of this repository. Started by hand from main;
# the release is a pre-release unless `prerelease` is switched off. Release id
# poe2-<game version>+r<revision> (contract); the tag and file names use
# "-" instead of "+".
# Two jobs: the build runs third-party tools and has read access only; the
# publish job has write access and runs nothing but the GitHub CLI.
name: Data release

on:
  workflow_dispatch:
    inputs:
      game-version:
        description: "Game version, must equal the patch the game-data step reads, e.g. 0.5.5.10"
        required: true
      revision:
        description: "Pipeline revision for this game version (whole number, no leading zero)"
        required: true
        default: "1"
      previous-tag:
        description: "Tag of the previous data release to diff against, e.g. data-poe2-0.5.5.10-r1 (empty: no diff)"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: data-release-${{ inputs.game-version }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GAME_VERSION: ${{ inputs.game-version }}
      REVISION: ${{ inputs.revision }}
      PREVIOUS_TAG: ${{ inputs.previous-tag }}
      # the integration test must not be skipped here
      REQUIRE_POB: "1"
    steps:
      - name: Check the inputs and that the release does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GAME_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "game-version '$GAME_VERSION' is not a version" >&2; exit 1; }
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]] || { echo "revision '$REVISION' is not a whole number without leading zero" >&2; exit 1; }
          tag="data-poe2-${GAME_VERSION}-r${REVISION}"
          status=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" -i 2>&1 | head -n1 || true)
          if [[ "$status" != *"404"* ]]; then
            echo "tag $tag exists or could not be checked ($status); data releases are immutable" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set up headless PoB
        run: tools/setup_pob.sh

      - name: Pipeline tests against the real PoB
        run: pnpm exec turbo run test --filter=@astrolabe/data-pipeline

      - name: Build pipeline and snapshot
        run: |
          pnpm exec turbo run build --filter=@astrolabe/data-pipeline
          node apps/data-pipeline/dist/cli.js snapshot \
            --game-version "$GAME_VERSION" --revision "$REVISION" --out data-snapshots/current

      - name: Game data (crafting tables from the update servers)
        run: |
          set -o pipefail
          node apps/data-pipeline/dist/cli.js gamedata \
            --out data-snapshots/current/game-data 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Game version must match the patch that was read
        run: |
          patch=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data-snapshots/current/game-data/manifest.json","utf8")).patch.version)')
          if [ "$patch" != "$GAME_VERSION" ]; then
            echo "game-version input '$GAME_VERSION' differs from the patch read from the update server '$patch'" >&2
            exit 1
          fi

      - name: Item art (inventory images of the catalog's base items)
        run: |
          set -o pipefail
          # the dat tool calls `magick`; the runner image has ImageMagick 6 (`convert`) only
          if ! command -v magick >/dev/null; then
            sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
            command -v magick >/dev/null || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi
          node apps/data-pipeline/dist/cli.js item-art data-snapshots/current \
            --game-data data-snapshots/current/game-data \
            --out data-snapshots/current/item-art 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build catalog
        run: |
          set -o pipefail
          node apps/data-pipeline/dist/cli.js catalog data-snapshots/current \
            --out data-snapshots/current/catalog \
            --game-data data-snapshots/current/game-data \
            --item-art data-snapshots/current/item-art 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the previous data release
        if: env.PREVIOUS_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_TAG" =~ ^data-poe2-[0-9]+(\.[0-9]+){1,3}-r[1-9][0-9]*$ ]] || { echo "previous-tag '$PREVIOUS_TAG' is not a data release tag" >&2; exit 1; }
          file="catalog-${PREVIOUS_TAG#data-}.tar.gz"
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --dir previous --pattern "$file" --pattern "$file.sha256"
          (cd previous && sha256sum --check "$file.sha256")

      - name: Diff against the previous data release
        if: env.PREVIOUS_TAG != ''
        run: |
          set -euo pipefail
          file="catalog-${PREVIOUS_TAG#data-}.tar.gz"
          mkdir previous/catalog
          tar -C previous/catalog -xzf "previous/$file"
          previous_id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("previous/catalog/manifest.json","utf8")).release.id)')
          expected="${PREVIOUS_TAG#data-}"; expected="${expected/-r/+r}"
          [ "$previous_id" = "$expected" ] || { echo "previous catalog has id '$previous_id', expected '$expected'" >&2; exit 1; }
          set -o pipefail
          node apps/data-pipeline/dist/cli.js catalog-diff previous/catalog data-snapshots/current/catalog 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack the catalog
        run: |
          set -euo pipefail
          # catalog only: shards, manifest, findings and the item images (assets/items); raw game tables stay out (ADR-0005, ADR-0007)
          id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data-snapshots/current/catalog/manifest.json","utf8")).release.id)')
          expected="poe2-${GAME_VERSION}+r${REVISION}"
          [ "$id" = "$expected" ] || { echo "manifest release id '$id' differs from '$expected'" >&2; exit 1; }
          mkdir -p out
          file="catalog-${id//+/-}.tar.gz"
          tar -C data-snapshots/current/catalog -czf "out/$file" .
          (cd out && sha256sum "$file" > "$file.sha256")
          echo "$id" > out/release-id.txt

      - uses: actions/upload-artifact@v5
        with:
          name: data-release
          path: out/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: data-release
          path: out
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(cat out/release-id.txt)
          tag="data-${id//+/-}"
          (cd out && sha256sum --check catalog-*.sha256)
          # the tag may have been created since the build started
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag exists now; data releases are immutable" >&2
            exit 1
          fi
          # Never "latest": that slot belongs to the app installer (desktop.yml), which
          # electron-updater reads from releases/latest.
          flags=(--latest=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$tag" out/catalog-*.tar.gz out/catalog-*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Data release $id" \
            --notes "Catalog of data release $id (SHA-256 in the attached .sha256 file). Built by .github/workflows/data-release.yml from Path of Building PoE2 data (MIT) and game-data tables read with pathofexile-dat (MIT) and the community dat-schema; docs/adr/0005. Astrolabe is an unofficial fan project, not affiliated with or endorsed by Grinding Gear Games. The inventory images of base items (assets/items) are Grinding Gear Games' art, shown with the credit 'Graphics © Grinding Gear Games' (ADR-0007); findings.json lists what the pipeline could not resolve." \
            "${flags[@]}"
