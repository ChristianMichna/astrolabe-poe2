# Windows installer of the desktop app (apps/desktop, ADR-0004).
# - Pull requests that touch the app: build the unsigned installer, install it on a clean
#   Windows runner and check it end to end (apps/desktop/e2e), attach it as an artifact.
# - Push to main (same paths) or "Run workflow" with publish=true: the checked installer is
#   published as a GitHub release (Astrolabe-Setup-<version>.exe + latest.yml). Installed apps
#   update themselves from the latest release (electron-updater), so nobody installs by hand again.
# The installer bundles the newest published data release (data-release.yml).
name: Desktop installer

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/server/**"
      - "apps/calc/**"
      - "config/calc/**"
      - "config/calc-profiles/**"
      - "config/optimizer/**"
      - "apps/mcp-bridge/**"
      - "config/desktop/**"
      - "config/forge/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/server/**"
      - "apps/calc/**"
      - "config/calc/**"
      - "config/calc-profiles/**"
      - "config/optimizer/**"
      - "apps/mcp-bridge/**"
      - "config/desktop/**"
      - "config/forge/**"
      - ".github/workflows/desktop.yml"
  schedule:
    # Nightly: the whole recorded run S0 to S11 with the real tree search (takes hours).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      full-run:
        description: "Also replay the whole recorded run S0 to S11 (takes hours)"
        type: boolean
        default: false
      data-release-tag:
        description: "Tag of the data release to bundle, e.g. data-poe2-0.5.5.10-r15 (empty: the newest published one)"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub release of this build (pushes to main publish anyway)"
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  # A publish in progress is never cancelled by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: Data release for the installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.data.outputs.tag }}
    env:
      DATA_RELEASE_TAG: ${{ inputs.data-release-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The installer bundles a published data release (data-release.yml, real game data) instead
      # of building a snapshot of its own, so the bundled game data is the one the pipeline made.
      - name: Download and check the data release
        id: data
        run: |
          set -euo pipefail
          tag="$DATA_RELEASE_TAG"
          if [ -z "$tag" ]; then
            # every app release adds a release too: page through all of them, not the newest 100
            tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | { grep '^data-poe2-' || true; } | sort -V | tail -n1)
          fi
          test -n "$tag" || { echo "no data release found" >&2; exit 1; }
          # the tag is an input: only a data release tag (one line, no other characters) goes on
          [[ "$tag" =~ ^data-poe2-[0-9A-Za-z._+-]+$ ]] || { echo "not a data release tag" >&2; exit 1; }
          echo "Bundled data release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p dl data-snapshots/current/catalog
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'catalog-*.tar.gz' --pattern 'catalog-*.tar.gz.sha256' --dir dl
          shopt -s nullglob
          archives=(dl/catalog-*.tar.gz)
          sums=(dl/catalog-*.tar.gz.sha256)
          # exactly one archive and one checksum
          if [ "${#archives[@]}" != 1 ] || [ "${#sums[@]}" != 1 ]; then
            echo "the release must hold exactly one catalog archive and one checksum" >&2
            exit 1
          fi
          archive="${archives[0]}"
          # the checksum belongs to this archive: compare its hash with the archive's own
          expected=$(cut -d' ' -f1 "${sums[0]}")
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "the checksum file has no SHA-256" >&2; exit 1; }
          echo "$expected  $archive" | sha256sum -c -
          # list the archive into files first (grep -q on a pipe could end tar early and hide a match)
          tar tvzf "$archive" > dl/list.txt
          # only regular files and directories (no links, devices or pipes), no absolute paths, no ..
          if grep -Ev '^[-d]' dl/list.txt > /dev/null; then echo "the archive holds more than files and directories" >&2; exit 1; fi
          tar tzf "$archive" > dl/names.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' dl/names.txt > /dev/null; then echo "the archive has unsafe paths" >&2; exit 1; fi
          tar xzf "$archive" -C data-snapshots/current/catalog
          test -f data-snapshots/current/catalog/manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: data-release
          path: data-snapshots/current/catalog/
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: catalog
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: data-release
          path: apps/desktop/data-release
      - name: Fetch the pinned PoB and LuaJIT sources
        shell: bash
        run: |
          pob_ref=$(sed -n 's/^POB_REF="\${POB_REF:-\([0-9a-f]*\)}".*/\1/p' tools/setup_pob.sh)
          lj_ref=$(sed -n 's/^LUAJIT_REF="\([0-9a-f]*\)".*/\1/p' tools/setup_pob.sh)
          echo "PoB $pob_ref / LuaJIT $lj_ref"
          test -n "$pob_ref" && test -n "$lj_ref"
          fetch() { git init -q "$3"; git -C "$3" remote add origin "$1"; git -C "$3" fetch -q --depth 1 origin "$2"; git -C "$3" checkout -q FETCH_HEAD; }
          fetch https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git "$pob_ref" .pob/PathOfBuilding-PoE2
          fetch https://github.com/LuaJIT/LuaJIT.git "$lj_ref" .pob/luajit-src
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build luajit.exe next to PoB's lua51.dll (MSVC, UCRT like PoB's DLLs)
        shell: cmd
        run: |
          cd .pob\luajit-src\src
          call msvcbuild.bat
          copy /Y luajit.exe ..\..\PathOfBuilding-PoE2\runtime\luajit.exe
      - run: pnpm build
      - run: pnpm --filter @astrolabe/mcp-bridge pack:mcpb
      - name: Check the packaged files
        run: node apps/desktop/scripts/stage.mjs
      - name: Version of this build
        id: version
        shell: bash
        # <major>.<minor> from apps/desktop/package.json, patch = number of the workflow run, so
        # every build is newer than the one before and installed apps see it as an update.
        run: |
          base=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        run: pnpm exec electron-builder --win --x64 --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}
      - name: Check that the passive tree icon sheets are in the installer
        working-directory: apps/desktop
        shell: bash
        # The packaging filter drops all *.zst and takes the icon sheets back in; without them the
        # tree shows no node pictures (F-12), so a filter that stopped working must fail the build.
        run: |
          dir=$(ls -d release/win-unpacked/resources/pob/PathOfBuilding-PoE2/src/TreeData/*/ | sort -V | tail -n 1)
          echo "tree data folder: $dir"
          ls "$dir"skills_*_BC1.dds.zst
          test "$(ls "$dir"skills_*_BC1.dds.zst | wc -l)" -ge 1
          if ls "$dir"*.dds.zst | grep -v '/skills_.*_BC1\.dds\.zst$' | grep -q .; then
            echo "other textures were packaged too"; exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: Astrolabe-Setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          retention-days: 14
          if-no-files-found: error

  e2e:
    # The installer exactly as users get it: installed on a clean runner, started, driven like
    # Claude Desktop drives it (extension, stringified arguments, Windows paths), real PoB.
    name: Windows end-to-end
    needs: [catalog, installer]
    runs-on: windows-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.full-run) && 330 || 40 }}
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @astrolabe/desktop...
      - uses: actions/download-artifact@v5
        with:
          name: Astrolabe-Setup
          path: installer
      - name: Data release of the recorded guide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the guide fixture (apps/desktop/e2e/fixtures) opens only on the release it was made with
          id=$(node -p "require('./apps/desktop/e2e/fixtures/guide-file.json').guide.metadata.dataReleaseId")
          tag="data-${id//+/-}"
          echo "Recorded guide: $id ($tag)"
          mkdir -p dl guide-data
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'catalog-*.tar.gz*' --dir dl
          (cd dl && sha256sum -c ./*.sha256)
          tar xzf dl/catalog-*.tar.gz -C guide-data
          echo "E2E_GUIDE_DATA_DIR=$(cygpath -w "$PWD/guide-data")" >> "$GITHUB_ENV"
      - name: Run the end-to-end check
        shell: bash
        env:
          DATA_TAG: ${{ needs.catalog.outputs.tag }}
          E2E_FULL_RUN: ${{ (github.event_name == 'schedule' || inputs.full-run) && '1' || '0' }}
        run: |
          # data-poe2-0.5.5.10-r15 -> poe2-0.5.5.10+r15
          id="${DATA_TAG#data-}"
          export EXPECT_DATA_RELEASE_ID="${id%-r*}+r${id##*-r}"
          cd apps/desktop
          node --experimental-strip-types e2e/run.ts "$(ls ../../installer/*.exe | head -n1)" ../../e2e-out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-windows
          path: e2e-out/
          retention-days: 14
          if-no-files-found: warn

  publish:
    # Installed apps update themselves from the latest release. Only the installer that passed
    # the end-to-end check is published, from main.
    name: Publish release
    needs: [installer, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Astrolabe-Setup
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          set -euo pipefail
          ls -l release
          # electron-updater reads latest.yml: it must name the version of this release
          grep -q "^version: $VERSION\$" release/latest.yml || { echo "latest.yml does not say version $VERSION" >&2; cat release/latest.yml; exit 1; }
          # Not a pre-release: electron-updater only follows the latest full release (the data
          # releases are pre-releases and stay out of its way).
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Astrolabe $VERSION" --latest \
            --notes "Installer build of commit $GITHUB_SHA. Installed apps update themselves; the data (game version) is bundled from the newest data release."

  update-local:
    # Windows update check (local feed)
    name: Windows update check (local feed)
    needs: [installer]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @astrolabe/desktop...
      - uses: actions/download-artifact@v5
        with:
          name: Astrolabe-Setup
          path: installer
      - name: Take the newest older release as the installed app
        id: old
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep '^v[0-9]' | grep -vx "v$VERSION" | sort -V | tail -n1 || true)
          if [ -z "$tag" ]; then
            echo "::warning::no earlier app release exists yet, the update check is skipped"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Installed app: $tag, expected update: $VERSION"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'Astrolabe-Setup-*.exe' --dir old
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Update from the old release to this build
        if: steps.old.outputs.found == 'true'
        shell: bash
        run: |
          cd apps/desktop
          node --experimental-strip-types e2e/update.ts "$(ls ../../old/*.exe | head -n1)" ../../e2e-update-out "$VERSION" --local ../../installer
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: update-local
          path: e2e-update-out/
          retention-days: 14
          if-no-files-found: ignore

  update-github:
    # Windows update check (GitHub release)
    name: Windows update check (GitHub release)
    needs: [installer, publish]
    if: needs.publish.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @astrolabe/desktop...
      - uses: actions/download-artifact@v5
        with:
          name: Astrolabe-Setup
          path: installer
      - name: Take the newest older release as the installed app
        id: old
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep '^v[0-9]' | grep -vx "v$VERSION" | sort -V | tail -n1 || true)
          if [ -z "$tag" ]; then
            echo "::warning::no earlier app release exists yet, the update check is skipped"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Installed app: $tag, expected update: $VERSION"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'Astrolabe-Setup-*.exe' --dir old
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Update from the old release to this build
        if: steps.old.outputs.found == 'true'
        shell: bash
        run: |
          cd apps/desktop
          node --experimental-strip-types e2e/update.ts "$(ls ../../old/*.exe | head -n1)" ../../e2e-update-out "$VERSION"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: update-github
          path: e2e-update-out/
          retention-days: 14
          if-no-files-found: ignore
