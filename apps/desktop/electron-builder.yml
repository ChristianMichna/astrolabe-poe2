# Windows installer (Astrolabe-Setup.exe) with auto-update over GitHub Releases.
# The app is not code-signed yet: Windows SmartScreen warns on first start (see README).
appId: app.astrolabe.desktop
productName: Astrolabe
copyright: Astrolabe. Fan project, not affiliated with Grinding Gear Games.
directories:
  output: release
  buildResources: build
# Main process and preload are single bundles (scripts/bundle.mjs): no node_modules in the installer.
files:
  - dist/main.cjs
  - dist/preload.cjs
  - package.json
extraResources:
  - { from: ../web/dist, to: web }
  - { from: ../../config/forge, to: config/forge }
  - { from: ../../config/desktop, to: config/desktop }
  - { from: ../../config/agents, to: config/agents }
  # Calc service: PoB with luajit.exe (built by CI, see desktop.yml), the worker's Lua file, its
  # pool settings, the calc profiles and the tree optimizer settings.
  - from: ../../.pob/PathOfBuilding-PoE2
    to: pob/PathOfBuilding-PoE2
    # Headless PoB needs no images, compressed textures or docs (checked against the golden builds).
    filter:
      - "**/*"
      - "!.git/**"
      - "!.github/**"
      - "!docs/**"
      - "!spec/**"
      - "!runtime-win32.zip"
      - "!**/*.zst"
      # ... except the node icon sheets of the passive tree (about 4 MB), which the tree view cuts its pictures from.
      - "src/TreeData/*/skills_*_BC1.dds.zst"
      - "!**/*.png"
      - "!**/*.jpg"
  - { from: ../calc/lua, to: calc-lua }
  - { from: ../../config/calc, to: config/calc }
  - { from: ../../config/calc-profiles, to: config/calc-profiles }
  - { from: ../../config/optimizer, to: config/optimizer }
  - { from: ../../config/crafting, to: config/crafting }
  - { from: ../../config/economy, to: config/economy }
  - { from: ../mcp-bridge/dist/astrolabe.mcpb, to: astrolabe.mcpb }
  - { from: data-release, to: data-release }
  - { from: ../../examples/guides, to: example-guides }
asar: true
# Fuses: the exe cannot be used as a plain Node interpreter, only the signed-in asar loads.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  target:
    - { target: nsis, arch: [x64] }
  icon: build/icon.png
  # No publisherName: without a signature electron-updater verifies the file hash from latest.yml only.
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Astrolabe-Setup-${version}.${ext}
publish:
  provider: github
  owner: ChristianMichna
  repo: astrolabe-poe2
  releaseType: release
